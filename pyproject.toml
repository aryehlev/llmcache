[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmcache"
version = "0.1.0"
description = "Unified explicit-caching control plane for LLM serving platforms (vLLM, SGLang, OpenAI, Anthropic, Gemini)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aryehlev" }]
keywords = ["llm", "cache", "prompt-caching", "kv-cache", "vllm", "sglang", "inference"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
gemini = ["google-genai>=0.3"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/aryehlev/llmcache"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
