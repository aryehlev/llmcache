[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llmcache"
version = "0.2.0"
description = "Explicit KV caching for LLM serving engines — an LMCache-style offload/reuse layer keyed by explicit cache handles (vLLM, SGLang)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "aryehlev" }]
keywords = ["llm", "kv-cache", "prefix-caching", "lmcache", "vllm", "sglang", "inference", "prompt-caching"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.1", "numpy>=1.24"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/aryehlev/llmcache"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
